<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#163d36">
  <title>Relay - WhatsApp conversations</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div class="app-shell">
    <main class="main-area">
      <div class="sticky-header">
        <header class="topbar">
          <nav class="primary-nav top-tabs" id="primary-nav" aria-label="Main navigation"></nav>
          <div class="topbar-actions">
            <label class="global-search"><input id="global-search" type="search" placeholder="Search names, numbers, groups..." aria-label="Search live records" autocomplete="off"></label>
            <div id="header-filter-slot"></div>
          </div>
        </header>
        <div class="smart-list-root" id="smart-list-root"></div>
      </div>
      <div class="page-wrap" id="page-wrap"></div>
    </main>
  </div>
  <div id="modal-root"></div>
  <div id="directory-filter-root"></div>
  <div id="voice-call-root"></div>
  <div class="app-loading" id="app-loading" role="status" aria-live="polite" aria-label="Loading" hidden>
    <div class="app-loading-card"><span class="app-loading-spinner" aria-hidden="true"></span><span id="app-loading-label">Loading...</span></div>
  </div>
  <div class="toast-region" id="toast-region" aria-live="polite"></div>
</body>
</html>
